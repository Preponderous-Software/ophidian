name: Browser build

# Builds the pygbag (WebAssembly) version of the game from src/, whose
# main.py is the browser entry point, and deploys it to arcade as the static
# site at https://ophidian.play.danielstephenson.dev. Pull requests only
# build; a deploy needs a manual run or ARCADE_ENABLED=true on a push.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # the Strata release whose grid relay draws the browser's 3D view
  STRATA_RELAY_VERSION: "0.9.1"

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag==0.9.3

      # pygbag packs only what is under src/, so a pip-installed graphik would
      # be missing in the browser. Install the exact line requirements.txt pins
      # into src/ for this build only (it is never committed).
      - name: Put graphik into src for the web build
        run: |
          GRAPHIK="$(grep -E '^graphik @ ' requirements.txt)"
          python -m pip install --no-deps --target src "$GRAPHIK"
          rm -rf src/*.dist-info

      # graphik's pygbag template is pygbag 0.9.3's default page plus a 2D/3D
      # button and the Strata grid relay's canvas. It starts in 3D (the
      # template's default, as on the desktop), loading the relay alongside
      # the game, and falls back to 2D with the reason if 3D can't start; a
      # player's choice of 2D is remembered, and ?view=2d starts in 2D
      # without downloading anything of the 3D view.
      - name: Build with pygbag
        run: |
          TEMPLATE="$(PYTHONPATH=src python -c 'from preponderous.graphik.grid3d.web import templatePath; print(templatePath())')"
          python -m pygbag --build --title Ophidian --template "$TEMPLATE" src

      - name: Check the build has an index page
        run: test -f src/build/web/index.html

      # The 3D view's files (Strata's prebuilt grid relay), from Strata's
      # release, checked against its SHA256SUMS, next to the page. Pinned:
      # the relay's wire format must match graphik's grid3d.web.
      - name: Put Strata's grid relay next to the page
        run: |
          PYTHONPATH=src python -m preponderous.graphik.grid3d.relay --strata ${{ env.STRATA_RELAY_VERSION }} --dest src/build/web
          test -f src/build/web/grid-relay.js
          grep -q 'id="graphik3d"' src/build/web/index.html

      - name: Write the deployed version
        run: echo "$(cat version.txt)+g${GITHUB_SHA::7}" > web-version.txt

      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: ophidian
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: src/build/web
          version-file: web-version.txt
